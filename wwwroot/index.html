<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restauracja</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <h1>Restauracja</h1>

    <section>
        <h2>Zarezerwuj stolik</h2>

        <form id="availability-form">

            <label for="reservation-date">
                Data
            </label>

            <input type="date"
                   id="reservation-date"
                   required>

            <label for="reservation-time">
                Godzina
            </label>

            <input type="time"
                   id="reservation-time"
                   required>

            <label for="number-of-guests">
                Liczba osób
            </label>

            <input type="number"
                   id="number-of-guests"
                   min="1"
                   required>

            <button type="submit">
                Sprawdź dostępność
            </button>

        </form>

        <div id="availability-result"></div>

        <section id="reservation-section" hidden>
            <h2>Dane rezerwacji</h2>
            <p id="selected-reservation-summary"></p>

            <form id="reservation-form">
                <label for="customer-name">
                    Imię
                </label>

                <input type="text"
                       id="customer-name"
                       required>

                <label for="phone-number">
                    Numer telefonu
                </label>
                <input type="tel"
                       id="phone-number"
                       required>

                <label for="notes">
                    Uwagi
                </label>

                <textarea id="notes"></textarea>

                <button type="submit">
                    Zarezerwuj stolik
                </button>
            </form>
        </section>

    </section>

    <script src="/js/app.js"></script>

</body>
</html>
